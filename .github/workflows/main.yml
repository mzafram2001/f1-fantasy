name: Update F1 Fantasy data

on:
  schedule:
    # Runs every Monday at 05:00 UTC (after race weekend)
    - cron: '0 5 * * 1'
  workflow_dispatch: # Allows manual trigger from the Actions tab

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skelmis-f1-fantasy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run update script
        env:
          F1_USER_GUID: ${{ secrets.F1_USER_GUID }}
          F1_TOKEN: ${{ secrets.F1_TOKEN }}
        run: python scripts/getRoundData.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Update F1 Fantasy data" && git push)
